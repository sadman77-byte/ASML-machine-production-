    :root {

      --card: #1e293b;
      --card-inner: #0f172a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --analogy-bg: #172554;
      --analogy-border: #60a5fa;
      --border: #334155;
      --green: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      line-height: 1.75;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 28px;
      border-radius: 16px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    header h1 {
      margin: 0 0 8px 0;
      font-size: 1.75rem;
      color: var(--accent);
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--card);
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 18px;
    }
    select, input, button {
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-inner);
      color: var(--text);
      font-size: 0.96rem;
    }
    input { flex: 1; min-width: 220px; }
    button {
      background: var(--accent-dark);
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    button:hover { background: #0369a1; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .chip {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .chip:hover, .chip.active {
      background: var(--accent-dark);
      border-color: var(--accent);
      color: #fff;
    }
    .main-card {
      background: var(--card);
      padding: 28px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .main-card h2 {
      margin: 0 0 12px 0;
      font-size: 1.45rem;
      color: #fff;
    }
    .simple-text {
      font-size: 1.05rem;
      color: #e2e8f0;
      margin-bottom: 18px;
    }
    .steps-container {
      display: grid;
      gap: 12px;
      margin: 18px 0;
    }
    .step-item {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      padding: 14px 16px;
      border-radius: 10px;
    }
    .step-item strong {
      color: var(--accent);
      display: block;
      margin-bottom: 4px;
    }
    .analogy-box {
      background: var(--analogy-bg);
      border-left: 4px solid var(--analogy-border);
      padding: 16px 18px;
      border-radius: 10px;
      margin-bottom: 18px;
    }
    .analogy-box strong {
      display: block;
      color: #93c5fd;
      margin-bottom: 4px;
      font-size: 0.95rem;
    }
    .daily-impact {
      background: var(--card-inner);
      border: 1px solid var(--border);
      padding: 16px 18px;
      border-radius: 10px;
    }
    .daily-impact strong {
      display: block;
      color: #34d399;
      margin-bottom: 4px;
      font-size: 0.95rem;
    }
    /* Interactive Switch Box for Chip Calculation */
    .demo-box {
      background: var(--card-inner);
      border: 1px dashed var(--accent);
      padding: 18px;
      border-radius: 12px;
      margin: 18px 0;
    }
    .demo-box h4 {
      margin: 0 0 8px 0;
      color: var(--accent);
    }
    .switch-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 12px;
    }
    .bit-btn {
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: #94a3b8;
      font-weight: 700;
      cursor: pointer;
    }
    .bit-btn.on {
      background: var(--green);
      color: #052e16;
      border-color: #34d399;
    }
    .calc-result {
      padding: 10px 16px;
      background: #172554;
      border-radius: 8px;
      font-weight: 600;
      color: #93c5fd;
    }
    .all-list {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(265px, 1fr));
      gap: 14px;
    }
    .mini-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    .mini-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .mini-card h4 {
      margin: 0 0 6px 0;
      color: var(--accent);
      font-size: 1rem;
    }
    .mini-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
    }
  </style>
</head>

    let currentLang = "bn";
    let currentTopicId = "chip_making_process";
    let bits = [0, 1, 0, 1]; // 4-bit interactive transistor switches (8, 4, 2, 1)

    const langSelect = document.getElementById("langSelect");
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const speakBtn = document.getElementById("speakBtn");
    const topicChips = document.getElementById("topicChips");
    const detailCard = document.getElementById("detailCard");
    const overviewGrid = document.getElementById("overviewGrid");

    function getDecimalValue() {
      return bits[0] * 8 + bits[1] * 4 + bits[2] * 2 + bits[3] * 1;
    }

    function renderUI() {
      const ui = UI_TEXT[currentLang];
      document.getElementById("appTitle").textContent = ui.title;
      document.getElementById("appSubtitle").textContent = ui.subtitle;
      searchInput.placeholder = ui.placeholder;
      searchBtn.textContent = ui.searchBtn;
      speakBtn.textContent = ui.speakBtn;

      // Render topic chips
      topicChips.innerHTML = "";
      TOPICS.forEach(topic => {
        const data = topic[currentLang];
        const chip = document.createElement("span");
        chip.className = "chip" + (topic.id === currentTopicId ? " active" : "");
        chip.textContent = data.title.split("?")[0];
        chip.onclick = () => {
          currentTopicId = topic.id;
          renderUI();
        };
        topicChips.appendChild(chip);
      });

      // Render main card
      const activeTopic = TOPICS.find(t => t.id === currentTopicId) || TOPICS[0];
      const info = activeTopic[currentLang];

      let stepsHTML = "";
      if (info.steps && info.steps.length) {
        stepsHTML = `<div class="steps-container">` +
          info.steps.map(s => `<div class="step-item"><strong>${s.head}</strong><span>${s.desc}</span></div>`).join("") +
          `</div>`;
      }

      let demoHTML = "";
      if (activeTopic.interactiveDemo) {
        const weights = [8, 4, 2, 1];
        const buttons = bits.map((b, idx) =>
          `<button class="bit-btn ${b ? "on" : ""}" onclick="toggleBit(${idx})">Switch (${weights[idx]}): ${b ? "ON (1)" : "OFF (0)"}</button>`
        ).join("");
        demoHTML = `
          <div class="demo-box">
            <h4>${ui.demoTitle}</h4>
            <div style="color: var(--muted); font-size: 0.92rem;">${ui.demoHint}</div>
            <div class="switch-row">
              ${buttons}
              <div class="calc-result">${ui.demoResultPrefix} ${getDecimalValue()}</div>
            </div>
          </div>
        `;
      }

      detailCard.innerHTML = `
        <span class="badge">${info.tag}</span>
        <h2>${info.title}</h2>
        <p class="simple-text">${info.summary}</p>
        ${stepsHTML}
        ${demoHTML}
        <div class="analogy-box">
          <strong>${ui.analogyLabel}</strong>
          <span>${info.analogy}</span>
        </div>
        <div class="daily-impact">
          <strong>${ui.impactLabel}</strong>
          <span>${info.impact}</span>
        </div>
      `;

      // Render all cards grid below
      overviewGrid.innerHTML = "";
      TOPICS.forEach(topic => {
        const d = topic[currentLang];
        const mini = document.createElement("div");
        mini.className = "mini-card";
        mini.innerHTML = `<h4>${d.title}</h4><p>${d.summary.slice(0, 95)}...</p>`;
        mini.onclick = () => {
          currentTopicId = topic.id;
          renderUI();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        overviewGrid.appendChild(mini);
      });
    }

    window.toggleBit = function(index) {
      bits[index] = bits[index] ? 0 : 1;
      renderUI();
    };

    function handleSearch() {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) return;
      const found = TOPICS.find(t =>
        t.keywords.some(k => q.includes(k)) ||
        t[currentLang].title.toLowerCase().includes(q) ||
        t[currentLang].summary.toLowerCase().includes(q)
      );
      if (found) {
        currentTopicId = found.id;
        renderUI();
      }
    }

    function speakCurrent() {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const activeTopic = TOPICS.find(t => t.id === currentTopicId) || TOPICS[0];
      const info = activeTopic[currentLang];
      const stepText = info.steps ? info.steps.map(s => `${s.head}. ${s.desc}`).join(" ") : "";
      const text = `${info.title}. ${info.summary} ${stepText} ${info.analogy} ${info.impact}`;
      const utter = new SpeechSynthesisUtterance(text);
      const langMap = { bn: "bn-BD", en: "en-US", zh: "zh-CN", hi: "hi-IN" };
      utter.lang = langMap[currentLang] || "en-US";
      window.speechSynthesis.speak(utter);
    }

    langSelect.onchange = (e) => {
      currentLang = e.target.value;
      window.speechSynthesis?.cancel();
      renderUI();
    };
    searchBtn.onclick = handleSearch;
    searchInput.onkeyup = (e) => { if (e.key === "Enter") handleSearch(); };
    speakBtn.onclick = speakCurrent;

    renderUI();
  </script>
</body>
</html>
